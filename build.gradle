plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '1.0.17'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    flatDir {
        dir 'libs'
    }
    // Jade / The One Probe 都只用于悬浮提示插件（MeProviderJadePlugin、MeProviderTopPlugin）。
    // Jade 的许可是 CC-BY-NC-SA-4.0，不允许随仓库再分发，所以不放进 libs/，改从 Modrinth 的 Maven 取
    // —— 只做编译期链接，产物里只有接口名引用（与 AE2 等可选依赖同理）。TOP 是 MIT，同样走 Maven 保持统一。
    maven {
        url = "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }
}

configurations {
    // Local mod jars needed at runtime (dev runClient) but not bundled into our jar.
    localRuntime
}

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"

    // Compile-time API only (the mod loads alongside these at runtime).
    compileOnly files("libs/Modern-Industrialization-2.5.6.jar")
    compileOnly files("libs/extended-industrialization-1.16.2-1.21.1.jar")
    compileOnly files("libs/tesseract-api-neoforge-1.12.16-1.21.1.jar")
    compileOnly files("libs/appliedenergistics2-19.2.17.jar")
    // Jade：仅用于「设备在线 / 设备离线」悬浮提示的自有插件（MeProviderJadePlugin）。
    // 属可选依赖：Jade 不在时它的注解扫描不存在，我们这个类永远不会被加载。
    // 为什么不用 AE2 的 IGT 扩展点：见 MeProviderJadePlugin 的类注释（MI 所有机器共用 MachineBlock，
    // AE2 的适配器会先强转 BE 再判断，导致对每一台 MI 机器都抛 ClassCastException）。
    compileOnly "maven.modrinth:jade:15.10.6+neoforge"
    // The One Probe（TOP）：仅用于「设备在线 / 设备离线」悬浮提示的自有插件（MeProviderTopPlugin）。
    // MIT 许可无再分发顾虑，但同样只做编译期链接 —— TOP 不在时它的类永不被加载。
    compileOnly "maven.modrinth:the-one-probe:1.21_neo-12.0.8"
    // ExtendedAE 只在「扩展仓」路径上被引用（它的 ex_pattern_provider 菜单类型），仍属可选依赖：
    // compileOnly = 仅编译期链接，产物里只有类名引用，不打包它的实现（它也是 LGPL-3.0）。
    compileOnly files("libs/ExtendedAE-1.21-2.2.36-neoforge.jar")
    // Cloth Config：可选的「游戏内配置界面」（MiAe2ConfigScreen 实现 NeoForge 的 IConfigScreenFactory）。
    // 它和 AE2 同样是 LGPL-3.0，而 libs/ 里已经躺着同样许可的 AE2 ⇒ 放进 libs/ 符合本仓库既有惯例
    // （Jade 走 Maven 是因为 CC-BY-NC-SA 不允许再分发，Cloth Config 没有这个问题）。
    // 只做编译期链接 + dev 运行时：产物里只有接口名引用，没装它的玩家一切照旧。
    compileOnly files("libs/cloth-config-15.0.140-neoforge.jar")
    // GuideME：本 mod 自己的指南书（MiAe2Guide）+「使用手册」物品（GuideBookItem）用它注册/打开。
    // 它是 MI / EI / AE2 共同的硬依赖（EI 硬依赖 guideme、AE2 硬依赖 guideme），所以运行期一定在；
    // 这里只需要编译期链接（与上面几个 compileOnly 同理）。
    compileOnly files("libs/guideme-21.1.17.jar")

    // Runtime for dev runClient (copied into run/mods).
    localRuntime files("libs/Modern-Industrialization-2.5.6.jar")
    localRuntime files("libs/extended-industrialization-1.16.2-1.21.1.jar")
    localRuntime files("libs/tesseract-api-neoforge-1.12.16-1.21.1.jar")
    localRuntime files("libs/appliedenergistics2-19.2.17.jar")
    // guideme is a required dependency of MI / EI / AE2.
    localRuntime files("libs/guideme-21.1.17.jar")
    // ExtendedAE 仅用于 dev 运行时测试扩展供应仓的升级/配方（本 mod 不硬依赖它）。
    localRuntime files("libs/ExtendedAE-1.21-2.2.36-neoforge.jar")
    // glodium 是 ExtendedAE 的前置库。
    localRuntime files("libs/Glodium-1.21-2.2-neoforge.jar")
    // Cloth Config：dev 客户端也要能打开本 mod 的配置界面（它的类只在客户端被加载，专用服不受影响）。
    localRuntime files("libs/cloth-config-15.0.140-neoforge.jar")
    // The One Probe：只为了在 dev / 冒烟环境里真实验证 MeProviderTopPlugin 的 IMC 注册路径
    // （启动日志里应出现「[悬浮提示] The One Probe 插件已注册」）。同样走 Maven，不进仓库。
    localRuntime "maven.modrinth:the-one-probe:1.21_neo-12.0.8"
}

// Copy the local dependency jars into run/mods before launching the dev client/server.
tasks.register('copyLocalDepsToMods', Copy) {
    from configurations.localRuntime
    into layout.projectDirectory.dir('run/mods')
}

tasks.matching { it.name == 'runClient' || it.name == 'runServer' || it.name == 'runGameTestServer' }.configureEach {
    dependsOn 'copyLocalDepsToMods'
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            loader_version_range   : loader_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

// 指南正文只维护一份，构建时再镜像一份给 **MI 自己的指南书**。
//
// MI 的指南用 `MIGuide.ID = modern_industrialization:book` + `folder("mi_guidebook")` 注册，而 GuideME 读页面是
// 「任意命名空间下的这个目录」（官方文档：Pages for a guidebook are read from all resource packs across all
// namespace）—— Industrialization Overdrive 就是这么把 `assets/modern_industrialization/mi_guidebook/io_guide.md`
// 并进 MI 指南书侧栏的（position 99）。我们放在**自己的命名空间**下，于是页面 id 仍是
// `mi_ae2_pattern_provider:<页名>`，既不会撞上 MI 自己的 `modern_industrialization:<页名>`，页内省略命名空间的
// 物品 id 也仍然按我们自己的命名空间解析 ⇒ 与自带指南的那一份**逐字节相同**，两边同时生效。
tasks.named('processResources', ProcessResources).configure {
    from('src/main/resources/assets/mi_ae2_pattern_provider/guides/mi_ae2_pattern_provider/guide') {
        into 'assets/mi_ae2_pattern_provider/mi_guidebook'
    }
}

tasks.named('jar', Jar).configure {
    archiveVersion = "${mod_version}-${minecraft_version}"
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

// Copy the built jar to the workspace root and into the HMCL test client's mods folder.
// 本项目目录比其它项目浅一层（无 git 仓库父目录），所以用 ../ 而不是 ../../
tasks.register('copyToWorkspace') {
    doLast {
        copy {
            from(tasks.named('jar'))
            into file('../')
        }
        copy {
            from(tasks.named('jar'))
            into file('../minecraft/.minecraft/versions/1.21.1-NeoForge-MI/mods')
        }
    }
}
tasks.named('build') {
    dependsOn 'copyToWorkspace'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
