plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '1.0.17'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    flatDir {
        dir 'libs'
    }
}

configurations {
    // Local mod jars needed at runtime (dev runClient) but not bundled into our jar.
    localRuntime
}

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"

    // Compile-time API only (the mod loads alongside these at runtime).
    compileOnly files("libs/Modern-Industrialization-2.5.6.jar")
    compileOnly files("libs/extended-industrialization-1.16.2-1.21.1.jar")
    compileOnly files("libs/tesseract-api-neoforge-1.12.16-1.21.1.jar")
    compileOnly files("libs/appliedenergistics2-19.2.17.jar")

    // Runtime for dev runClient (copied into run/mods).
    localRuntime files("libs/Modern-Industrialization-2.5.6.jar")
    localRuntime files("libs/extended-industrialization-1.16.2-1.21.1.jar")
    localRuntime files("libs/tesseract-api-neoforge-1.12.16-1.21.1.jar")
    localRuntime files("libs/appliedenergistics2-19.2.17.jar")
    // guideme is a required dependency of MI / EI / AE2.
    localRuntime files("libs/guideme-21.1.17.jar")
}

// Copy the local dependency jars into run/mods before launching the dev client/server.
tasks.register('copyLocalDepsToMods', Copy) {
    from configurations.localRuntime
    into layout.projectDirectory.dir('run/mods')
}

tasks.matching { it.name == 'runClient' || it.name == 'runServer' || it.name == 'runGameTestServer' }.configureEach {
    dependsOn 'copyLocalDepsToMods'
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            loader_version_range   : loader_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    archiveVersion = "${mod_version}-${minecraft_version}"
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

// Copy the built jar to the workspace root and into the HMCL test client's mods folder.
// 本项目目录比其它项目浅一层（无 git 仓库父目录），所以用 ../ 而不是 ../../
tasks.register('copyToWorkspace') {
    doLast {
        copy {
            from(tasks.named('jar'))
            into file('../')
        }
        copy {
            from(tasks.named('jar'))
            into file('../minecraft/.minecraft/versions/1.21.1-NeoForge-MI/mods')
        }
    }
}
tasks.named('build') {
    dependsOn 'copyToWorkspace'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
